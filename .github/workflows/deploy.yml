name: Deploy tarve.dev

# Deploys the site built against a tagged @tarve/core. omarcosr/tarve's release.yml starts it
# with a repository_dispatch (`tarve-release`, client_payload.ref = the tag) once npm publish
# succeeds; it can also be run by hand. Needs the CLOUDFLARE_API_TOKEN secret (Workers edit)
# and the CLOUDFLARE_ACCOUNT_ID variable on the "site" environment of this repo.
on:
  repository_dispatch:
    types: [tarve-release]
  workflow_dispatch:
    inputs:
      core-ref:
        description: "omarcosr/tarve tag or ref to build against"
        required: true

concurrency:
  group: tarve-website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tarve.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: site
    permissions:
      contents: read

    steps:
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not configured for the site environment: deploy tarve.dev by hand (bun run deploy)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout omarcosr/tarve
        if: steps.credentials.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          repository: omarcosr/tarve
          ref: ${{ inputs.core-ref || github.event.client_payload.ref }}

      - name: Checkout website
        if: steps.credentials.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          path: website

      - name: Setup Bun
        if: steps.credentials.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Setup Rust
        if: steps.credentials.outputs.deploy == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # The site's playgrounds run the WebAssembly runtime.
      - name: Install wasm-bindgen
        if: steps.credentials.outputs.deploy == 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install dependencies
        if: steps.credentials.outputs.deploy == 'true'
        run: |
          # Not frozen for the core checkout: its lockfile is the core repo's business, not a site failure.
          bun install
          cd website && bun install --frozen-lockfile

      - name: Build and deploy
        if: steps.credentials.outputs.deploy == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run build:cf
          bunx wrangler deploy
